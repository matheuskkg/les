# Integração contínua (INF-09): testes do server e do web a cada push no master e pull request, e os E2E com os dois no ar.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# Um push novo cancela a execução anterior do mesmo PR; no master, cada commit tem a sua.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  server:
    name: Server (mvn test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Unitários, integração em H2, ArchUnit e o contrato do openapi.json (DEC-07).
      - run: mvn -B -ntp test

  web:
    name: Web (tipos, testes e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      # Os tipos do cliente da API precisam estar gerados a partir do openapi.json versionado.
      - name: Tipos da API em dia com o openapi.json
        run: |
          npm run gerar-api
          git diff --exit-code src/api/esquema.d.ts
      - run: npm run typecheck
      - run: npm test
      # O typecheck já conferiu os tipos; aqui só o bundle do Vite.
      - run: npx vite build

  e2e:
    name: E2E (Playwright)
    needs: [server, web]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      # O Chrome já vem na imagem do runner (DEC-02); só o server é compilado antes, para o Playwright subi-lo rápido.
      - run: mvn -B -ntp -q -DskipTests compile
        working-directory: apps/server
      - run: npx playwright test
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: relatorio-do-playwright
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
