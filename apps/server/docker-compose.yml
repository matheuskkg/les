name: livraria

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: livraria
      POSTGRES_USER: livraria
      POSTGRES_PASSWORD: livraria
    ports:
      - "${DB_PORTA:-5432}:5432"
    volumes:
      - postgres-dados:/var/lib/postgresql/data

volumes:
  postgres-dados:
