spring:
  datasource:
    url: jdbc:h2:mem:livraria;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    # H2 em modo PostgreSQL não aceita o tinyint da coluna tipo_revisao do Envers (ver DialetoH2).
    database-platform: br.fatec.les.livraria.compartilhado.infraestrutura.persistencia.DialetoH2
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: true
