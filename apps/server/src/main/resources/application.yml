spring:
  application:
    name: livraria-server
  profiles:
    default: h2
  # Chaves dos provedores de IA (IA_*_CHAVE) podem vir de um .env no diretório de execução, fora do git (DEC-03).
  config:
    import: optional:file:.env[.properties]
  # A aplicação sobe sem chave de IA: toda a autoconfiguração de modelos do Spring AI fica desligada (DEC-03).
  # O adapter monta o cliente de cada provedor a partir de livraria.ia.provedores.
  ai:
    model:
      chat: none
      embedding: none
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
  jpa:
    open-in-view: false
    properties:
      # Log de transação (RNF-GER-002, DEC-08, DEC-14): tabelas _aud e revisão com nomes em português.
      org.hibernate.envers.audit_table_suffix: _aud
      org.hibernate.envers.revision_field_name: revisao
      org.hibernate.envers.revision_type_field_name: tipo_revisao
      # Exclusões mantêm a linha completa na tabela _aud (DEC-14).
      org.hibernate.envers.store_data_at_delete: true
  sql:
    init:
      mode: never
  jackson:
    default-property-inclusion: non_null

springdoc:
  writer-with-default-pretty-printer: true
  writer-with-order-by-keys: true

livraria:
  jwt:
    segredo: ${JWT_SEGREDO:livraria-dev-jwt-segredo-2026-com-mais-de-32-bytes}
    validade: 8h
  sessao:
    cookie-seguro: false
  seed:
    habilitado: true
    local: classpath:seed/*.sql
  ia:
    # Tempo limite de leitura por chamada a um provedor (DEC-03).
    tempo-limite: 20s
    # Chave vazia significa provedor sem chave; a cadeia ignora o provedor (DEC-03).
    # Cada item vira um adapter; opções opcionais e seus padrões:
    #   tool-choice: auto|required (padrão auto), formato: ferramenta|json-schema|instrucoes (padrão ferramenta),
    #   max-chamadas: inteiro >= 1 (padrão 5), max-tokens: inteiro >= 1 ou 0 = sem teto (padrão 0),
    #   cabecalhos: mapa de cabeçalhos HTTP extras.
    provedores:
      gemini:
        url-base: https://generativelanguage.googleapis.com/v1beta/openai
        modelo: ${IA_GEMINI_MODELO:gemini-3.5-flash-lite}
        chave: ${IA_GEMINI_CHAVE:}
        # Teto de saída (ALT-08, DEC-03): corta despejos de catálogo sem tocar nas respostas normais, que ficam
        # bem abaixo disso.
        max-tokens: 800
      groq:
        url-base: https://api.groq.com/openai/v1
        modelo: ${IA_GROQ_MODELO:qwen/qwen3.8-27b}
        chave: ${IA_GROQ_CHAVE:}
        # Teto de saída (ALT-08, DEC-03): sem teto, o pedido reserva mais saída que o OTPM de 1.000/min — 1.162 na
        # rodada de 28/10; abaixo disso o Groq deixa a chamada passar em vez de responder 429.
        max-tokens: 800
      openrouter:
        url-base: https://openrouter.ai/api/v1
        modelo: ${IA_OPENROUTER_MODELO:google/gemma-4-31b-it:free}
        chave: ${IA_OPENROUTER_CHAVE:}
        tool-choice: auto
        max-chamadas: 5
        # Teto de saída (ALT-08, DEC-03): limita despejos de catálogo sem tocar nas respostas normais, que ficam
        # bem abaixo disso.
        max-tokens: 1200
        cabecalhos:
          X-Title: Livraria LES
      nvidia:
        url-base: https://integrate.api.nvidia.com/v1
        modelo: ${IA_NVIDIA_MODELO:nvidia/nemotron-3.5-super-vl-120b-a12b}
        chave: ${IA_NVIDIA_CHAVE:}
        # Teto de saída (ALT-08, DEC-03): o despejo de catálogo do nvd-06 saiu daqui com 3.364 tokens; o teto corta
        # esse despejo sem tocar nas respostas normais, que ficam bem abaixo disso.
        max-tokens: 1200
